name: Build Watch4 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate SDK and install fixed packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and check debug APK
        working-directory: watch4_hr_bridge
        run: gradle --no-daemon --console=plain --stacktrace assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          APK=watch4_hr_bridge/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch4-HR-Test
          path: |
            watch4_hr_bridge/app/build/outputs/apk/debug/app-debug.apk
            watch4_hr_bridge/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          path: |
            watch4_hr_bridge/app/build/reports/lint-results-debug.*
            watch4_hr_bridge/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

  android11-lifecycle:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Exercise service on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: gradle -p watch4_hr_bridge --no-daemon --console=plain --stacktrace connectedDebugAndroidTest
      - name: Upload lifecycle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android11-lifecycle
          path: |
            watch4_hr_bridge/app/build/reports/androidTests/connected/**
            watch4_hr_bridge/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn

