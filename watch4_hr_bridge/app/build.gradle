plugins {
    id 'com.android.application'
}
android {
    namespace 'com.watch4.hrbridge'
    compileSdk 35
    defaultConfig {
        applicationId 'com.watch4.hrbridge'
        minSdk 26
        // Target current APIs; minSdk still allows installation on Android 11.
        // This foreground diagnostic explicitly gates BLE testing to API <=30.
        targetSdk 35
        versionCode 4
        versionName '0.4-clock-fix'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildToolsVersion '35.0.0'
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

