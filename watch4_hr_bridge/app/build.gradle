plugins {
    id 'com.android.application'
}
android {
    namespace 'com.watch4.hrbridge'
    compileSdk 35
    defaultConfig {
        applicationId 'com.watch4.hrbridge'
        minSdk 26
        targetSdk 30
        versionCode 1
        versionName '0.1-test'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
