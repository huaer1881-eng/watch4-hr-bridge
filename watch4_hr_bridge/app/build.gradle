plugins {
    id 'com.android.application'
}
android {
    namespace 'com.watch4.hrbridge'
    compileSdk 35
    defaultConfig {
        applicationId 'com.watch4.hrbridge'
        minSdk 26
        // Target current APIs; minSdk still allows installation on Android 11.
        // This foreground diagnostic explicitly gates BLE testing to API <=30.
        targetSdk 35
        versionCode 5
        versionName '0.5-ride'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildToolsVersion '35.0.0'
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

